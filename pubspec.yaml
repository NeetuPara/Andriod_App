name: flutter_app
description: A new Flutter project for Offline Chat with VLM and Voice.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animations
  flutter_animate: ^4.5.0
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  
  # State & Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  http: ^1.6.0
  
  # AI Model Inference
  llama_flutter_android: ^0.1.1 # Auto-compiles native libs for Android
  
  # Offline Capabilities
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5
  # pdf_text: ^0.5.0 # Mobile only, replaced for cross-platform support
  syncfusion_flutter_pdf: ^24.1.41
  file_picker: ^8.0.0
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dependency_overrides:
  http: ^1.6.0
